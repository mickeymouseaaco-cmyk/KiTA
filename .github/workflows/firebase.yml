# Checks the code, uploads the rules and server functions to your Firebase
# project (kita-4a2e1, Singapore), then tests the live project.
#
# Runs on every push to main, and on demand: GitHub → Actions → "Firebase" →
# Run workflow. The upload and live test need one secret,
# FIREBASE_SERVICE_ACCOUNT (docs/FIREBASE.md, "Automatic deploys"). Without it
# they are skipped and only the checks run.
name: Firebase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: kita-4a2e1

jobs:
  verify:
    name: 1 · Check everything (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            firebase/tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix firebase/tests
      - name: Typecheck, lint, logic tests, rules tests, end-to-end test
        run: npm run verify

  screenshots:
    name: Screenshots of the app (preview)
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Playwright's browsers don't support Ubuntu 26.04 (ubuntu-latest) yet.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            firebase/tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm ci --prefix functions && npm ci --prefix firebase/tests
      - run: npm --prefix functions run build
      - name: Build the website against the emulators
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_USE_EMULATORS: '1'
      - name: Install a browser
        run: |
          npm install --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Two phones, real app, emulators
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          npx --prefix firebase/tests firebase emulators:exec --only auth,firestore,storage,functions --project demo-together \
            "node e2e/serve.cjs dist 8099 & sleep 1 && node e2e/look-and-feel.cjs && node e2e/audit-all.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: e2e/screens
          if-no-files-found: ignore
      - name: Keep the screenshots on the "screenshots" branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -d e2e/screens ] || exit 0
          cd e2e/screens
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for $SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  deploy:
    name: 2 · Upload rules and functions to Singapore
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.key.outputs.present }}
    steps:
      - name: Is the deploy key set?
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was uploaded. See docs/FIREBASE.md, 'Automatic deploys'."
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firebase/tests/package-lock.json
      - if: steps.key.outputs.present == 'true'
        run: npm ci --prefix functions && npm ci --prefix firebase/tests
      - uses: google-github-actions/auth@v3
        if: steps.key.outputs.present == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore and Storage rules
        if: steps.key.outputs.present == 'true'
        run: npx --prefix firebase/tests firebase deploy --only firestore,storage --project "$PROJECT_ID" --force --non-interactive
      - name: Deploy Functions to Singapore
        if: steps.key.outputs.present == 'true'
        run: |
          deploy() {
            npx --prefix firebase/tests firebase deploy --only functions \
              --project "$PROJECT_ID" --force --non-interactive
          }
          # The very first deploy turns on Google Cloud services, and some of
          # them need a minute or two before they accept functions. Retry then.
          deploy || { echo "Retrying in 90 seconds…"; sleep 90; deploy; } || { echo "Retrying in 180 seconds…"; sleep 180; deploy; }
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.key.outputs.present == 'true'
      - name: Let the app call its functions
        if: steps.key.outputs.present == 'true'
        # The app's callable functions must accept requests from the internet;
        # each one checks the caller's Firebase sign-in itself (functions/src/index.ts).
        # firebase deploy tries to set this but skips unchanged functions, so it's set here every time.
        run: |
          for svc in acceptinvite unlinkcouple requestreconnect deleteaccount startstepssync stopstepssync syncsteps synclocation; do
            gcloud run services add-iam-policy-binding "$svc" \
              --project "$PROJECT_ID" --region asia-southeast1 \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null
            echo "✔ $svc can be called by the app"
          done

  live-check:
    name: 3 · Test the live project
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register, pair, check rules, delete (temporary accounts)
        run: npm run verify:live
