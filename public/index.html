<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: use the whole screen on iPhone; the app adds safe-area padding itself.
         maximum-scale=1: stops iPhone zooming in when you tap a text box (pinch-to-zoom still works). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>KiTA</title>
    <meta name="description" content="KiTA: a gentle place for the two of you to look after yourselves, and each other." />

    <!-- Install as an app (KiTA on the home screen). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080A" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KiTA" />
    <!-- black-translucent: the app draws all the way to the top, under the clock and Dynamic Island,
         like a native app (pages add the safe-area space themselves). The clock turns white, so the app
         adds a soft shade behind it in light mode. iPhone reads this only when KiTA is added to the
         Home Screen, so an icon added earlier needs adding again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="KiTA" />

    <!-- react-native-web's recommended reset: full height, the app scrolls, not the page.
         #root's height comes from --app-h (set by the script below) so the app fills the
         whole screen, from under the clock down to the home bar, with no gap. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #fbf7f4;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #16141b;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: var(--app-h, 100%);
        flex: 1;
      }
    </style>
    <script>
      // On an iPhone home-screen app with the see-through status bar, iOS reports the
      // page as shorter than the screen (it leaves out the status bar), even though the
      // page starts at the very top. That left a strip at the bottom and cut the tab bar
      // off. So, there only, size the app to the real screen height.
      (function () {
        function fit() {
          var nav = window.navigator;
          var h = window.innerHeight;
          var standalone = nav.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (standalone && /iPhone|iPad|iPod/.test(nav.userAgent)) {
            var portrait = window.innerHeight >= window.innerWidth;
            var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
            if (full > h && full - h < 140) h = full;
          }
          document.documentElement.style.setProperty('--app-h', h + 'px');
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () {
          setTimeout(fit, 300);
        });
      })();
    </script>

    <!-- Offline start-up and notifications (public/sw.js). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
      // Remember Chrome/Android's install offer so KiTA can show its own friendly button.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__kitaInstallPrompt = e;
        window.dispatchEvent(new Event('kita-installable'));
      });
    </script>
  </head>

  <body>
    <noscript>KiTA needs JavaScript turned on.</noscript>
    <div id="root"></div>
  </body>
</html>
